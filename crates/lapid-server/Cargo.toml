[package]
name = "lapid-server"
description = "OpenAI-compatible HTTP server and web UI for lapid hub models"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["download"]
# `-hf owner/repo[:QUANT]`: repo listing and downloads (HTTP through lapid-convert).
download = ["lapid-hub/download"]

[dependencies]
clap.workspace = true
lapid.workspace = true
lapid-hub = { workspace = true, default-features = false }
lapid-convert.workspace = true
lapid-nn.workspace = true
serde.workspace = true
serde_json.workspace = true
axum = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
futures-util = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
rust-embed = { workspace = true }
flate2 = { workspace = true }
mime_guess = { workspace = true }
base64 = { workspace = true }
