[package]
name = "lapid-format"
description = "lapid: the .lapid model file format"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
lapid-tensor.workspace = true
serde.workspace = true
serde_json.workspace = true
blake3.workspace = true

# No mmap on wasm (files are read into memory there; prefer `Reader::from_bytes`).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
memmap2.workspace = true
# Multithreaded hashing of large tensors and blobs (pure Rust).
blake3 = { workspace = true, features = ["rayon"] }
